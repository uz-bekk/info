<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault System v2</title>

<style>
:root{
    --bg:#0a0a0a;
    --card:#111;
    --border:#00ff66;
    --text:#e5ffe5;
    --muted:#8cbf99;
    --accent:#00ff66;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Consolas, monospace;
    min-height:100vh;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 20%, rgba(0,255,102,.08), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(0,255,102,.05), transparent 25%);
    pointer-events:none;
}

header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid rgba(0,255,102,.25);
    background:#050505;
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    color:var(--accent);
    letter-spacing:4px;
    text-shadow:0 0 10px var(--accent);
}

#loginScreen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111;
    border:1px solid var(--accent);
    border-radius:14px;
    padding:30px;
    box-shadow:0 0 20px rgba(0,255,102,.15);
}

.login-box h2{
    text-align:center;
    color:var(--accent);
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    background:#0b0b0b;
    border:1px solid #1f1f1f;
    color:white;
    outline:none;
    border-radius:8px;
}

input:focus{
    border-color:var(--accent);
    box-shadow:0 0 10px rgba(0,255,102,.25);
}

button{
    cursor:pointer;
    border:none;
    padding:12px 16px;
    border-radius:8px;
    background:var(--accent);
    color:black;
    font-weight:bold;
    transition:.25s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 0 15px rgba(0,255,102,.4);
}

#loginBtn{
    width:100%;
    margin-top:12px;
}

#errorMsg{
    color:#ff6666;
    margin-top:12px;
    text-align:center;
}

#vaultApp{
    display:none;
}

#loading{
    text-align:center;
    padding:25px;
    color:var(--accent);
}

.folder{
    margin:20px;
    border:1px solid rgba(0,255,102,.25);
    border-radius:12px;
    overflow:hidden;
}

.folder-header{
    padding:14px 18px;
    background:#111;
    color:var(--accent);
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.folder-content{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:15px;
    padding:15px;
}

.file-card{
    background:var(--card);
    border:1px solid rgba(0,255,102,.2);
    border-radius:12px;
    padding:15px;
    transition:.3s;
}

.file-card:hover{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 0 15px rgba(0,255,102,.15);
}

.file-name{
    color:var(--accent);
    word-break:break-word;
    margin-bottom:10px;
}

.file-desc{
    color:var(--muted);
    font-size:14px;
    min-height:50px;
    margin-bottom:12px;
}

.download-btn{
    display:inline-block;
    text-decoration:none;
    color:black;
    background:var(--accent);
    padding:10px 12px;
    border-radius:8px;
    font-weight:bold;
}

.console{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:#050505;
    border-top:1px solid rgba(0,255,102,.35);
    height:260px;
    display:flex;
    flex-direction:column;
    z-index:100;
}

.console-header{
    padding:10px;
    color:var(--accent);
    border-bottom:1px solid rgba(0,255,102,.2);
}

.console-log{
    flex:1;
    overflow:auto;
    padding:10px;
    font-size:12px;
    color:#9cffbc;
}

.console-tools{
    padding:10px;
    border-top:1px solid rgba(0,255,102,.2);
}

.console-tools .row{
    display:flex;
    gap:10px;
}

#hashResult{
    margin-top:8px;
    color:#7cff7c;
    word-break:break-all;
    font-size:12px;
}

.spacer{
    height:280px;
}

@media(max-width:600px){
    .folder-content{
        grid-template-columns:1fr;
    }

    .console{
        height:300px;
    }

    .console-tools .row{
        flex-direction:column;
    }
}
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2>VAULT ACCESS</h2>
        <input type="password" id="passwordInput" placeholder="Enter password">
        <button id="loginBtn">Unlock Vault</button>
        <div id="errorMsg"></div>
    </div>
</div>

<div id="vaultApp">
    <header>
        <h1>VAULT SYSTEM</h1>
    </header>

    <div id="loading">Loading repository...</div>
    <div id="foldersContainer"></div>
    <div class="spacer"></div>
</div>

<div class="console">
    <div class="console-header">DEV CONSOLE v2</div>

    <div class="console-log" id="consoleLog"></div>

    <div class="console-tools">
        <div class="row">
            <input id="hashInput" placeholder="Enter text to SHA-256 hash">
            <button id="hashBtn">Generate Hash</button>
        </div>
        <div id="hashResult"></div>
    </div>
</div>

<script>
const API_ROOT =
"https://api.github.com/repos/uz-bekk/info/contents";

const SHORT_TXT_URL =
"https://raw.githubusercontent.com/uz-bekk/info/main/short.txt";

const SESSION_KEY = "vault_session_v2";

const PASSWORD_HASH =
"2bf0064d802c91d9dff63bd0d406922198f2843d9338b5b5ec52890e040c00fc";

const descriptions = {};

function log(message){
    const box = document.getElementById("consoleLog");
    const time = new Date().toLocaleTimeString();
    box.innerHTML += `[${time}] ${message}<br>`;
    box.scrollTop = box.scrollHeight;
}

async function sha256(text){
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return [...new Uint8Array(hashBuffer)]
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

async function login(){
    const input = document.getElementById("passwordInput").value;

    log("Password check initiated");

    const hash = await sha256(input);

    if(hash === PASSWORD_HASH){
        log("Authentication successful");

        sessionStorage.setItem(SESSION_KEY, "true");

        showVault();
    }else{
        log("Authentication failed");
        document.getElementById("errorMsg").textContent =
            "Invalid password";
    }
}

function showVault(){
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("vaultApp").style.display = "block";

    loadVault();
}

async function fetchJSON(url){
    const response = await fetch(url);

    if(!response.ok){
        throw new Error(`${response.status} ${response.statusText}`);
    }

    return response.json();
}

async function loadDescriptions(){
    try{
        log("Loading short.txt");

        const response = await fetch(SHORT_TXT_URL);

        if(!response.ok){
            throw new Error("short.txt unavailable");
        }

        const text = await response.text();

        const lines = text.split("\n");

        for(const line of lines){

            const cleaned = line.trim();

            if(!cleaned) continue;

            const match = cleaned.match(/^\d+\.\s+(\S+)\s+(.*)$/);

            if(match){
                descriptions[match[1]] = match[2];
            }
        }

        log("short.txt loaded");
    }
    catch(error){
        log("short.txt error: " + error.message);
    }
}

async function getFolderContents(url){
    let files = [];

    try{
        const items = await fetchJSON(url);

        for(const item of items){

            if(item.type === "dir"){

                log("Scanning folder: " + item.name);

                const nested = await getFolderContents(item.url);

                files.push(...nested);
            }
            else if(item.type === "file"){

                files.push(item);

                log("File loaded: " + item.name);
            }
        }
    }
    catch(error){
        log("Folder scan error: " + error.message);
    }

    return files;
}

function createFileCard(file){

    const desc =
        descriptions[file.name] || "No description";

    return `
        <div class="file-card">
            <div class="file-name">${file.name}</div>
            <div class="file-desc">${desc}</div>
            <a class="download-btn"
               href="${file.download_url}"
               target="_blank">
               Download
            </a>
        </div>
    `;
}

async function loadVault(){

    document.getElementById("loading").style.display = "block";

    try{

        await loadDescriptions();

        log("Fetching repository root");

        const rootItems = await fetchJSON(API_ROOT);

        const container =
            document.getElementById("foldersContainer");

        container.innerHTML = "";

        const folders =
            rootItems.filter(item => item.type === "dir");

        log(`Detected ${folders.length} folders`);

        for(const folder of folders){

            const files =
                await getFolderContents(folder.url);

            const folderElement =
                document.createElement("div");

            folderElement.className = "folder";

            folderElement.innerHTML = `
                <div class="folder-header">
                    <span>${folder.name}</span>
                    <span>(${files.length})</span>
                </div>
                <div class="folder-content">
                    ${files.map(createFileCard).join("")}
                </div>
            `;

            const header =
                folderElement.querySelector(".folder-header");

            const content =
                folderElement.querySelector(".folder-content");

            header.addEventListener("click",()=>{
                content.style.display =
                    content.style.display === "none"
                    ? "grid"
                    : "none";
            });

            container.appendChild(folderElement);
        }

        log("Repository load complete");

    }catch(error){

        log("Repository fetch error: " + error.message);

        document.getElementById("foldersContainer").innerHTML =
            `<div style="padding:20px;color:#ff6666;">
                Failed to load repository.
             </div>`;
    }

    document.getElementById("loading").style.display = "none";
}

document.getElementById("loginBtn")
.addEventListener("click", login);

document.getElementById("passwordInput")
.addEventListener("keydown", e=>{
    if(e.key === "Enter") login();
});

document.getElementById("hashBtn")
.addEventListener("click", async ()=>{

    const text =
        document.getElementById("hashInput").value;

    const hash = await sha256(text);

    document.getElementById("hashResult").textContent =
        hash;

    log("SHA-256 hash generated");
});

window.addEventListener("load", ()=>{

    log("Vault System v2 initialized");

    if(sessionStorage.getItem(SESSION_KEY) === "true"){

        log("Existing session restored");

        showVault();
    }
});
</script>

</body>
</html>

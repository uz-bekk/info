<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harorat Tahlili va Metrikasi</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #f97316; /* Issiqlik/alanga ramzi sifatida to'q sariq */
            --accent-cold: #38bdf8; /* Sovuq iqlim uchun ko'k rang */
            --border: #3f3f46;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
        .header span { color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 0.9rem; }
        
        /* Vizual va boshqaruv paneli uyg'unligi */
        .main-layout {
            display: flex;
            gap: 2rem;
            align-items: flex-start;
        }
        
        /* Termometr dizayni */
        .thermometer-zone {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .thermometer {
            width: 24px;
            height: 310px;
            background-color: var(--bg-main);
            border: 2px solid var(--border);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
        }
        .thermometer-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, var(--accent, #f97316), var(--accent-cold, #38bdf8));
            border-radius: 12px;
            transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* O'ng tarafdagi boshqaruv paneli */
        .control-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .field { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
        .field label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
        .field input, .field select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        .field input:focus, .field select:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
        }
        
        .results-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 0.6rem; 
            margin-top: 0.5rem;
        }
        .result-box { 
            background-color: var(--bg-main); 
            border: 1px solid var(--border); 
            padding: 0.75rem 1rem; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            gap: 0.5rem;
            /* Ulkan son kiritilganda matn blokdan chiqib ketmasligi uchun himoya */
            overflow-wrap: anywhere; 
        }
        .result-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); white-space: nowrap; }
        .result-value { font-size: 1rem; font-weight: 700; color: var(--text-main); text-align: right; }
        
        .reaction-display {
            font-size: 4.5rem;
            text-align: center;
            margin-top: 1rem;
            line-height: 1;
        }
    </style>
</head>
<body>

<main class="container">
    <header class="header">
        <h1><span>🌡️ Harorat</span> Metrikasi</h1>
        <p>Xalqaro standartlar bo'yicha harorat ko'rsatkichlarini hisoblash va tahlil qilish tizimi</p>
    </header>

    <div class="main-layout">
        <div class="thermometer-zone">
            <div class="thermometer">
                <div class="thermometer-fill" id="indicatorFill"></div>
            </div>
        </div>

        <div class="control-panel">
            <div class="field">
                <label for="inputTemp">Ko'rsatkichni kiriting</label>
                <input id="inputTemp" type="number" placeholder="Masalan: 25" step="any">
            </div>

            <div class="field">
                <label for="unit">O'lchov tizimi</label>
                <select id="unit">
                    <option value="C">Selsiy (°C)</option>
                    <option value="F">Farengeyt (°F)</option>
                    <option value="K">Kelvin (K)</option>
                </select>
            </div>

            <div class="results-panel">
                <div class="result-box">
                    <span class="result-label">Selsiy:</span>
                    <span class="result-value" id="resCelsius">—</span>
                </div>
                <div class="result-box">
                    <span class="result-label">Farengeyt:</span>
                    <span class="result-value" id="resFahrenheit">—</span>
                </div>
                <div class="result-box">
                    <span class="result-label">Kelvin:</span>
                    <span class="result-value" id="resKelvin">—</span>
                </div>
            </div>

            <div class="reaction-display" id="statusReaction">😐</div>
        </div>
    </div>
</main>

<script>
const inputElement = document.getElementById("inputTemp");
const unitElement = document.getElementById("unit");
const fillElement = document.getElementById("indicatorFill");
const reactionElement = document.getElementById("statusReaction");

const displayCelsius = document.getElementById("resCelsius");
const displayFahrenheit = document.getElementById("resFahrenheit");
const displayKelvin = document.getElementById("resKelvin");

// Haroratni Selsiy shkalasiga o'tkazish muvozanati
function boshlangichTizimgaOtkazish(qiymat, birlik) {
    if (birlik === "C") return qiymat;
    if (birlik === "F") return (qiymat - 32) * 5 / 9;
    if (birlik === "K") return qiymat - 273.15;
    return qiymat;
}

// Ulkan sonlarni interfeysga moslab xavfsiz formatlash funksiyasi
function xavfsizFormatlash(son, belgi) {
    if (isNaN(son)) return "—";
    if (!isFinite(son)) return son > 0 ? "∞" : "-∞"; // Matematik cheksizlik holati ramzi
    
    // Agar son o'ta ulkan yoki o'ta kichik bo'lsa, ilmiy eksponent formatga o'tadi
    if (Math.abs(son) > 1e12 || (Math.abs(son) < 1e-4 && son !== 0)) {
        return son.toExponential(4) + belgi;
    }
    // Standart holatda chiroyli bank/metrologiya ko'rinishida ajratib chiqariladi
    return son.toLocaleString('uz-UZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + belgi;
}

// Harorat o'zgarganda ishlovchi asosiy jarayon
function joriyHolatniYangilash() {
    const xomQiymat = inputElement.value;
    const tanlanganBirlik = unitElement.value;

    if (xomQiymat === "" || isNaN(parseFloat(xomQiymat))) {
        displayCelsius.textContent = "—";
        displayFahrenheit.textContent = "—";
        displayKelvin.textContent = "—";
        fillElement.style.height = "0%";
        reactionElement.textContent = "😐";
        return;
    }

    const haroratQiymati = parseFloat(xomQiymat);
    const celsius = boshlangichTizimgaOtkazish(haroratQiymati, tanlanganBirlik);

    // Barcha o'lchovlar uchun qayta hisoblash
    const fahrenheit = celsius * 9 / 5 + 32;
    const kelvin = celsius + 273.15;

    // Natijalarni xavfsiz chop etish
    displayCelsius.textContent = xavfsizFormatlash(celsius, " °C");
    displayFahrenheit.textContent = xavfsizFormatlash(fahrenheit, " °F");
    displayKelvin.textContent = xavfsizFormatlash(kelvin, " K");

    // Termometr ko'rsatkichini xavfsiz chegaralash (Giant sonlar kiritilganda ham 100% dan oshmaydi)
    let foizUluhi = (celsius + 20) / 70 * 100;
    if (isNaN(foizUluhi)) foizUluhi = 0;
    foizUluhi = Math.max(0, Math.min(100, foizUluhi));
    fillElement.style.height = foizUluhi + "%";

    // Iqlimga nisbatan vizual munosabat (Emotsiyalar)
    if (isNaN(celsius)) {
        reactionElement.textContent = "😐";
    } else if (celsius <= 0) {
        reactionElement.textContent = "🥶";
    } else if (celsius <= 15) {
        reactionElement.textContent = "😐";
    } else if (celsius <= 30) {
        reactionElement.textContent = "🙂";
    } else if (celsius <= 40) {
        reactionElement.textContent = "😎";
    } else {
        reactionElement.textContent = "🔥";
    }
}

// Jarayonlarni boshqaruvchi darchalarga biriktirish
inputElement.addEventListener("input", joriyHolatniYangilash);
unitElement.addEventListener("change", joriyHolatniYangilash);
</script>

</body>
</html>

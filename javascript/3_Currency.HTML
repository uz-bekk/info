
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valyuta Ayirboshlash Kalkulyatori</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #10b981; /* Moliya va pul belgilari uchun yashil rang */
            --border: #3f3f46;
            --radius: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.025em; }
        .header span { color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 0.9rem; }
        
        .field { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
        .field label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
        .field input, .field select {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus, .field select:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }
        
        .status-box {
            text-align: center;
            padding: 1rem;
            background-color: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .results-panel { margin-top: 1.75rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 0.75rem; }
        .results-panel h3 { font-size: 1.05rem; font-weight: 600; margin-bottom: 0.25rem; color: var(--text-main); }
        .result-box { background-color: var(--bg-main); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; }
        .result-label { font-size: 0.9rem; font-weight: 600; color: var(--text-muted); }
        .result-value { font-size: 1.05rem; font-weight: 700; color: var(--text-main); }
        .result-box.highlight { border-color: rgba(16, 185, 129, 0.4); background-color: rgba(16, 185, 129, 0.02); }
        .result-box.highlight .result-value { color: var(--accent); }
        
        .info-box {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            background-color: rgba(39, 39, 42, 0.4);
            border-radius: var(--radius);
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.5;
            border-left: 3px solid var(--accent);
        }
    </style>
</head>
<body>

<main class="container">
    <header class="header">
        <h1><span>Valyuta</span> Kurslari</h1>
        <p>Xalqaro moliya bozoridagi joriy stavkalar bo'yicha tezkor hisoblagich</p>
    </header>

    <div id="statusMessage" class="status-box">Amaldagi valyuta kurslari yangilanmoqda...</div>

    <div id="calcBody" style="display: none; margin-top: 1.5rem;">
        <div class="field">
            <label for="amount">Miqdorni kiriting</label>
            <input type="number" id="amount" placeholder="Masalan: 500 000" step="any" min="0">
        </div>

        <div class="field">
            <label for="from">Boshlang'ich valyuta turi</label>
            <select id="from"></select>
        </div>

        <div class="results-panel" id="resultsPanel" style="display: none;">
            <h3>Ayirboshlash qiymatlari:</h3>
            <div id="conversionList"></div>
            <div class="info-box" id="rateInfo"></div>
        </div>
    </div>
</main>

<script>
let exchangeRates = {};
const allowedCurrencies = ["USD", "UZS", "EUR", "RUB"];

// Sahifa yuklanganda joriy kurslarni olish
async function moliyaTiziminiIshgaTushirish() {
    try {
        const response = await fetch("https://v6.exchangerate-api.com/v6/b99b5219f17e0caed9af2a30/latest/USD");
        if (!response.ok) throw new Error();
        
        const data = await response.json();
        exchangeRates = data.conversion_rates;

        // Valyutalar ro'yxatini shakllantirish
        const selectElement = document.getElementById("from");
        selectElement.innerHTML = allowedCurrencies.map(currency => `<option value="${currency}">${currency}</option>`).join("");
        
        // Standart holatda UZS tanlangan bo'ladi
        selectElement.value = "UZS";

        // Interfeysni faollashtirish
        document.getElementById("statusMessage").style.display = "none";
        document.getElementById("calcBody").style.display = "block";

        // Hodisalarni bog'lash
        document.getElementById("amount").addEventListener("input", qiymatniHisoblash);
        document.getElementById("from").addEventListener("change", qiymatniHisoblash);
        
    } catch (error) {
        const statusBox = document.getElementById("statusMessage");
        statusBox.textContent = "Tizim xatoligi: Ma'lumotlarni yuklab bo'lmadi. Sahifani qayta yuklang.";
        statusBox.style.borderColor = "#ef4444";
        statusBox.style.color = "#ef4444";
    }
}

// Kiritilgan miqdorga qarab barcha valyutalarga nisbatan hisoblash
function qiymatniHisoblash() {
    const inputAmount = document.getElementById("amount").value;
    const sourceCurrency = document.getElementById("from").value;
    const resultsPanel = document.getElementById("resultsPanel");

    // Validatsiya
    if (!inputAmount || isNaN(inputAmount) || parseFloat(inputAmount) <= 0) {
        resultsPanel.style.display = "none";
        return;
    }

    const amount = parseFloat(inputAmount);
    const amountInUSD = amount / exchangeRates[sourceCurrency];
    
    resultsPanel.style.display = "flex";
    
    let listHTML = "";
    allowedCurrencies.forEach(targetCurrency => {
        const finalValue = amountInUSD * exchangeRates[targetCurrency];
        const isSelected = (targetCurrency === sourceCurrency) ? "highlight" : "";
        
        // Sonlarni bank tizimi formatida chiqarish (masalan: 12 500,00)
        const formattedValue = finalValue.toLocaleString('uz-UZ', {minimumFractionDigits: 2, maximumFractionDigits: 2});
        
        listHTML += `
            <div class="result-box ${isSelected}">
                <span class="result-label">${targetCurrency}</span>
                <span class="result-value">${formattedValue}</span>
            </div>
        `;
    });
    document.getElementById("conversionList").innerHTML = listHTML;

    // Quyidagi ma'lumot qismi
    const marketRateInUZS = (1 / exchangeRates[sourceCurrency]) * exchangeRates["UZS"];
    document.getElementById("rateInfo").innerHTML = `
        <strong>Ayirboshlash kursi:</strong> 1 ${sourceCurrency} = ${marketRateInUZS.toLocaleString('uz-UZ', {maximumFractionDigits: 2})} UZS<br>
        <span style="color: var(--accent)">✓ Barqarorlik:</span> Hisob-kitoblar xalqaro valyuta birjasining eng so'nggi rasmiy ma'lumotlariga tayanadi.
    `;
}

// Tizimni yuklash
moliyaTiziminiIshgaTushirish();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Son Tahlili</title>
    <style>
        :root {
            --bg-main: #09090b;
            --bg-card: #18181b;
            --bg-input: #27272a;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #10b981;
            --border: #3f3f46;
            --radius: 8px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .container {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
        .header span { color: var(--accent); }
        .header p { color: var(--text-muted); font-size: 0.9rem; }
        .field { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.5rem; }
        .field label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .field input {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
        }
        .field input:focus { border-color: var(--accent); }
        .btn-submit {
            width: 100%;
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: var(--radius);
            cursor: pointer;
        }
        .results-panel { margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 1rem; }
        .result-box { background-color: var(--bg-main); border: 1px solid var(--border); padding: 0.75rem 1rem; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; }
        .result-label { font-size: 0.9rem; color: var(--text-muted); }
        .result-value { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    </style>
</head>
<body>
<main class="container">
    <header class="header">
        <h1>Son Tahlili</h1>
        <p>Kiritilgan sonning juft/toq va xonali ekanini aniqlash</p>
    </header>
    <form onsubmit="event.preventDefault(); tahlil();">
        <div class="field">
            <label for="num">Istalgan butun son kiriting</label>
            <input type="number" id="num" required placeholder="Masalan: 99999999999999999999">
        </div>
        <button type="submit" class="btn-submit">Aniqlash</button>
    </form>
    <div class="results-panel">
        <div class="result-box"><span class="result-label">Son turi:</span><span class="result-value" id="res1">—</span></div>
        <div class="result-box"><span class="result-label">Xonalar soni:</span><span class="result-value" id="res2">—</span></div>
    </div>
</main>
<script>
function tahlil() {
    const rawValue = document.getElementById('num').value.trim();
    if (!rawValue) return;

    // Isboti va hisob-kitob uchun ishora (+/-) hamda ortiqcha nollarni tozalaymiz
    let cleanStr = rawValue.replace(/^[+-]/, '').replace(/^0+/, '');
    if (cleanStr === '') cleanStr = '0';

    // Agar kiritilgan qiymat toza butun son formatida bo'lsa (Giant sonlar uchun)
    if (/^\d+$/.test(cleanStr)) {
        // Juft/toqlikni aniqlash (faqat eng oxirgi raqamga qarab - eng xavfsiz va tezkor usul)
        const lastDigit = parseInt(cleanStr.slice(-1));
        document.getElementById('res1').textContent = (lastDigit % 2 === 0) ? 'Juft son' : 'Toq son';
        
        // Xonalar sonini aniqlash
        document.getElementById('res2').textContent = cleanStr.length + ' xonali';
    } else {
        // Agar son ilmiy ko'rinishda (e+21 kabi) kiritilgan bo'lsa
        const num = Number(rawValue);
        if (!isNaN(num) && Number.isInteger(num)) {
            try {
                // Katta sonlarni xavfsiz formatga o'tkazish
                const bigNum = BigInt(rawValue.includes('e') ? Math.round(num) : rawValue);
                document.getElementById('res1').textContent = (bigNum % 2n === 0n) ? 'Juft son' : 'Toq son';
                document.getElementById('res2').textContent = bigNum.toString().replace('-', '').length + ' xonali';
            } catch(e) {
                // Standart holatga qaytish (fallback)
                document.getElementById('res1').textContent = (num % 2 === 0) ? 'Juft son' : 'Toq son';
                document.getElementById('res2').textContent = Math.abs(num).toString().length + ' xonali';
            }
        } else {
            document.getElementById('res1').textContent = 'Faqat butun son kiriting!';
            document.getElementById('res2').textContent = '—';
        }
    }
}
</script>
</body>
</html>

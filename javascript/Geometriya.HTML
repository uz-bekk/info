<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Geometry Calculator</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:#0f172a;
    display:flex;
    justify-content:center;
    padding:20px;
}

.container{
    width:450px;
    background:#005;
    padding:15px;
    border:1px solid #00ff66;
    border-radius:10px;
}

h2{
    text-align:center;
    color:#00ff66;
}

select, button, input{
     width:90%;
    padding:18px;
    margin:10px 0;
    background:#000;
    color:#caffd8;
    border:1px solid #00ff66;
}
//input{
  width 200%;
  padding:18px;
    margin:10px 0;
    background:#000;
    color:#caffd8;
    border:1px solid #00ff66;
 justify-content: center;
}

button{
    cursor:pointer;
}

.result{
    margin-top:10px;
    padding:10px;
    border:1px solid #00ff66;
    min-height:50px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">
    <h2>Shape Calculator</h2>

    <select id="shape" onchange="renderInputs()">
        <option value="cube">Cube</option>
        <option value="box">Rectangular Box</option>
        <option value="sphere">Sphere</option>
        <option value="cylinder">Cylinder</option>
        <option value="cone">Cone</option>
    </select>

    <div id="inputs"></div>

    <button onclick="calculate()">Calculate</button>

    <div class="result" id="result"></div>
</div>

<script>
function renderInputs(){
    const shape = document.getElementById("shape").value;
    const box = document.getElementById("inputs");

    let html = "";

    if(shape === "cube"){
        html = `<input id="a" placeholder="Side (a)">`;
    }

    else if(shape === "box"){
        html = `
            <input id="l" placeholder="Length">
            <input id="w" placeholder="Width">
            <input id="h" placeholder="Height">
        `;
    }

    else if(shape === "sphere"){
        html = `<input id="r" placeholder="Radius">`;
    }

    else if(shape === "cylinder"){
        html = `
            <input id="r" placeholder="Radius">
            <input id="h" placeholder="Height">
        `;
    }

    else if(shape === "cone"){
        html = `
            <input id="r" placeholder="Radius">
            <input id="h" placeholder="Height">
        `;
    }

    box.innerHTML = html;
}

function calculate(){
    const shape = document.getElementById("shape").value;
    let result = "";

    if(shape === "cube"){
        let a = +document.getElementById("a").value;

        let sa = 6 * a * a;
        let v = a * a * a;

        result = `Surface Area: ${sa} <br> Volume: ${v}`;
    }

    else if(shape === "box"){
        let l = +document.getElementById("l").value;
        let w = +document.getElementById("w").value;
        let h = +document.getElementById("h").value;

        let sa = 2 * (l*w + l*h + w*h);
        let v = l * w * h;

        result = `Surface Area: ${sa} <br> Volume: ${v}`;
    }

    else if(shape === "sphere"){
        let r = +document.getElementById("r").value;

        let sa = 4 * Math.PI * r * r;
        let v = (4/3) * Math.PI * r * r * r;

        result = `Surface Area: ${sa.toFixed(2)} <br> Volume: ${v.toFixed(2)}`;
    }

    else if(shape === "cylinder"){
        let r = +document.getElementById("r").value;
        let h = +document.getElementById("h").value;

        let sa = 2 * Math.PI * r * (r + h);
        let v = Math.PI * r * r * h;

        result = `Surface Area: ${sa.toFixed(2)} <br> Volume: ${v.toFixed(2)}`;
    }

    else if(shape === "cone"){
        let r = +document.getElementById("r").value;
        let h = +document.getElementById("h").value;

        let l = Math.sqrt(r*r + h*h);

        let sa = Math.PI * r * (r + l);
        let v = (1/3) * Math.PI * r * r * h;

        result = `Surface Area: ${sa.toFixed(2)} <br> Volume: ${v.toFixed(2)}`;
    }

    document.getElementById("result").innerHTML = result;
}

renderInputs();
</script>

</body>
</html>
